[project]
name = "telegrana"
version = "0.1.0"
description = "Bot de Telegram com IA para as finanças pessoais da família."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Dependências de execução: cada uma justificada em docs/DECISOES.md.
dependencies = [
    "certifi>=2026.7",       # CAs para TLS verify-full com o Neon (D030)
    "httpx>=0.28",           # chamadas à Bot API do Telegram, com timeouts (PLANO 2; D031)
    "psycopg[binary]>=3.3",  # driver Postgres, sem ORM (PLANO 2; D030)
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "boto3>=1.40",  # já vem no runtime da Lambda; aqui só para scripts e testes (D031)
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# -------------------------------------------------------------------
# Ruff (lint + formatação)
# -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # ordem de imports
    "B",            # bugbear
    "UP",           # sintaxe moderna
    "S",            # segurança (bandit)
    "SIM", "C4", "RUF",
    "DTZ",          # datetime sempre com fuso (datas são críticas no domínio)
    "PT",           # boas práticas de pytest
    "T20",          # nada de print no código de produção
]
ignore = ["E501"]  # o formatador cuida do comprimento das linhas

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["T20", "S603", "S310"]

# -------------------------------------------------------------------
# mypy — estrito no código do projeto
# -------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["certifi", "boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# -------------------------------------------------------------------
# pytest
# -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: exige Postgres (TELEGRANA_TEST_DATABASE_URL)",
    "isolation: prova que uma conta não acessa dados de outra",
]

# -------------------------------------------------------------------
# bandit
# -------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B404", "B603"]  # subprocess é usado só em scripts/check_setup.py, com lista fixa de comandos
