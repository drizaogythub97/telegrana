AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Telegrana — base da conta: orçamentos, alertas, kill-switch, OIDC do GitHub, limite de
  permissões das Lambdas e bucket de artefatos (S0.2 + S1.3). Sem KMS de cliente e sem
  ações de orçamento pagas.

Parameters:
  AlertEmail:
    Type: String
    Description: E-mail que recebe os alertas de custo (passado no deploy; não fica no repositório).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    NoEcho: true
  GitHubSubPrefix:
    Type: String
    Default: "repo:drizaogythub97@225630126/telegrana@1397881731"
    Description: >-
      Prefixo do claim sub do OIDC no formato IMUTÁVEL do GitHub (dono@id/repo@id). Um
      repositório recriado com o mesmo nome não herda o acesso. Conferir com
      gh api repos/<dono>/<repo>/actions/oidc/customization/sub.
  MonthlyLimitUsd:
    Type: Number
    Default: 1
    Description: Teto mensal (USD) que dispara o kill-switch. Custos pagos com créditos contam.

Resources:
  # -------------------------------------------------------------------
  # Alertas
  # -------------------------------------------------------------------
  # Tópico que o orçamento aciona quando o teto estoura: e-mail + kill-switch.
  # Sem criptografia SSE: o Budgets não publica em tópico com a chave gerenciada aws/sns
  # e KMS de cliente está fora do plano. O conteúdo é só o aviso de custo.
  BudgetTripTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: telegrana-orcamento-estourado
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  BudgetTripTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BudgetTripTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BudgetsPublica
            Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref BudgetTripTopic
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
              ArnLike: {"aws:SourceArn": !Sub "arn:aws:budgets::${AWS::AccountId}:*"}

  # Tópico separado para o relatório do kill-switch (evita laço: ele não aciona o kill-switch).
  NoticeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: telegrana-avisos
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Alarmes de erro da aplicação (S8, D051) publicam aqui; a conta continua podendo publicar.
  NoticeTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref NoticeTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ContaPublica
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: sns:Publish
            Resource: !Ref NoticeTopic
          - Sid: AlarmesPublicam
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref NoticeTopic
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
              ArnLike: {"aws:SourceArn": !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:telegrana-*"}

  # -------------------------------------------------------------------
  # Orçamentos (sem ações pagas; custos cobertos por créditos CONTAM)
  # -------------------------------------------------------------------
  ZeroSpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: telegrana-gasto-zero
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 1, Unit: USD}
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 0.01
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: telegrana-teto-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyLimitUsd, Unit: USD}
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: SNS, Address: !Ref BudgetTripTopic}
    DependsOn: BudgetTripTopicPolicy

  # -------------------------------------------------------------------
  # Kill-switch: zera a concorrência das Lambdas "telegrana-*" (menos ela mesma)
  # -------------------------------------------------------------------
  KillSwitchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/telegrana-kill-switch
      RetentionInDays: 7

  KillSwitchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: telegrana-kill-switch
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kill-switch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Listar
                Effect: Allow
                Action: lambda:ListFunctions
                Resource: "*"
              - Sid: Estrangular
                Effect: Allow
                Action: [lambda:PutFunctionConcurrency, lambda:GetFunctionConcurrency]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:telegrana-*"
              - Sid: Avisar
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref NoticeTopic
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt KillSwitchLogGroup.Arn
              - Sid: TelegramDoAdmin
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/prod/telegram/bot_token"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/admin_telegram_id"
              - Sid: DecifrarSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"

  KillSwitchFunction:
    Type: AWS::Lambda::Function
    DependsOn: KillSwitchLogGroup
    Properties:
      FunctionName: telegrana-kill-switch
      Description: Zera a concorrência das Lambdas do Telegrana quando o orçamento estoura.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt KillSwitchRole.Arn
      Environment:
        Variables:
          NOTICE_TOPIC_ARN: !Ref NoticeTopic
          PREFIX: telegrana-
      Code:
        ZipFile: |
          # Kill-switch do Telegrana. Evento SNS do orçamento -> concorrência 0 nas Lambdas
          # "telegrana-*" (exceto esta). {"dry_run": true} só lista, sem alterar nada.
          import json, os, urllib.parse, urllib.request
          import boto3

          lam = boto3.client("lambda")
          sns = boto3.client("sns")
          ssm = boto3.client("ssm")

          def avisa_telegram(texto):
              # Melhor esforço: o e-mail (SNS) continua sendo o aviso garantido.
              try:
                  token = ssm.get_parameter(Name="/telegrana/prod/telegram/bot_token", WithDecryption=True)["Parameter"]["Value"]
                  admin = ssm.get_parameter(Name="/telegrana/admin_telegram_id")["Parameter"]["Value"]
                  dados = urllib.parse.urlencode({"chat_id": admin, "text": texto}).encode()
                  urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=dados, timeout=10)
              except Exception as exc:
                  print(json.dumps({"aviso_telegram": "falhou", "erro": type(exc).__name__}))

          def handler(event, context):
              dry_run = bool(isinstance(event, dict) and event.get("dry_run"))
              prefix = os.environ["PREFIX"]
              targets = []
              for page in lam.get_paginator("list_functions").paginate():
                  for fn in page["Functions"]:
                      name = fn["FunctionName"]
                      if name.startswith(prefix) and name != context.function_name:
                          targets.append(name)
              done, failed = [], []
              for name in targets:
                  if dry_run:
                      continue
                  try:
                      lam.put_function_concurrency(FunctionName=name, ReservedConcurrentExecutions=0)
                      done.append(name)
                  except Exception as exc:  # segue para as outras; o relatório mostra a falha
                      failed.append(f"{name}: {type(exc).__name__}")
              report = {"dry_run": dry_run, "alvos": targets, "zeradas": done, "falhas": failed}
              print(json.dumps(report))
              if not dry_run:
                  texto = (
                      "O orçamento mensal estourou e o kill-switch parou as Lambdas do Telegrana.\n"
                      f"Zeradas: {', '.join(done) or 'nenhuma'}\n"
                      f"Falhas: {', '.join(failed) or 'nenhuma'}\n"
                      "Para religar, veja deploy/README.md ou peça ao agente."
                  )
                  sns.publish(TopicArn=os.environ["NOTICE_TOPIC_ARN"], Subject="Telegrana: kill-switch acionado", Message=texto)
                  avisa_telegram("⚠️ " + texto)
              return report

  KillSwitchSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BudgetTripTopic
      Protocol: lambda
      Endpoint: !GetAtt KillSwitchFunction.Arn

  KillSwitchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KillSwitchFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref BudgetTripTopic
      SourceAccount: !Ref AWS::AccountId

  # -------------------------------------------------------------------
  # OIDC do GitHub (deploy sem chaves). Permissões do papel entram na S1.
  # -------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: telegrana-github-deploy
      Description: Deploy do Telegrana pelo GitHub Actions (ambientes dev/prod, só a partir da main).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProvider}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub":
                  - !Sub "${GitHubSubPrefix}:environment:dev"
                  - !Sub "${GitHubSubPrefix}:environment:prod"
      Policies:
        - PolicyName: deploy-telegrana
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/telegrana-dev/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/telegrana-prod/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: ValidarTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: Artefatos
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: Lambdas
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:telegrana-dev-*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:telegrana-prod-*"
              - Sid: PapeisSoComLimite
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:DeleteRolePolicy]
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/telegrana-dev-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/telegrana-prod-*"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary": !Ref LambdaBoundary
              - Sid: PapeisLeitura
                Effect: Allow
                Action: [iam:GetRole, iam:GetRolePolicy, iam:DeleteRole, iam:TagRole, iam:UntagRole, iam:UpdateAssumeRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/telegrana-dev-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/telegrana-prod-*"
              - Sid: PassarPapel
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/telegrana-dev-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/telegrana-prod-*"
                Condition:
                  StringEquals:
                    "iam:PassedToService": [lambda.amazonaws.com, scheduler.amazonaws.com]
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:TagResource, logs:UntagResource, logs:ListTagsForResource]
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/telegrana-dev-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/telegrana-prod-*"
              - Sid: LogsDescrever
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:DescribeMetricFilters]
                Resource: "*"
              - Sid: FiltrosDeErro
                Effect: Allow
                Action: [logs:PutMetricFilter, logs:DeleteMetricFilter]
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/telegrana-dev-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/telegrana-prod-*"
              - Sid: Alarmes
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:TagResource, cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:telegrana-*"
              - Sid: AlarmesDescrever
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: Agendas
                Effect: Allow
                Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule, scheduler:TagResource]
                Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/telegrana-*"
              - Sid: SegredosDoDeploy
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/*/neon/migrator_url"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/*/telegram/bot_token"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/*/telegram/webhook_secret"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/admin_telegram_id"
              - Sid: DecifrarSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"

  # -------------------------------------------------------------------
  # Limite de permissões obrigatório para todo papel criado pelo deploy (S1.3)
  # -------------------------------------------------------------------
  LambdaBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: telegrana-limite-lambdas
      Description: Teto de permissões dos papéis das Lambdas e agendas do Telegrana.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/telegrana-*"
          - Sid: Segredos
            Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters]
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/*"
          - Sid: DecifrarSsm
            Effect: Allow
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"
          - Sid: InvocarLambdasDoProjeto
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:telegrana-*"

  # -------------------------------------------------------------------
  # Artefatos do SAM (apagados em 7 dias; custo de centavos pago pelos créditos)
  # -------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "telegrana-artefatos-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: apaga-artefatos-antigos
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoTls
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
            Condition:
              Bool: {"aws:SecureTransport": "false"}

  # -------------------------------------------------------------------
  # Conjunto de avaliação da IA (D016, D036): privado, fora do Git
  # -------------------------------------------------------------------
  EvalBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "telegrana-avaliacao-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: versoes-antigas
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 90}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  EvalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvalBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoTls
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt EvalBucket.Arn, !Sub "${EvalBucket.Arn}/*"]
            Condition:
              Bool: {"aws:SecureTransport": "false"}

  # Só leitura: o job de avaliação do CI (ambiente "avaliacao" do GitHub). PRs de fork
  # não recebem token OIDC. Lê o conjunto e a chave do Groq de DEV (teto próprio).
  GitHubEvalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: telegrana-github-avaliacao
      Description: Avaliacao da IA no GitHub Actions (somente leitura do conjunto e da chave de dev).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProvider}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "${GitHubSubPrefix}:environment:avaliacao"
      Policies:
        - PolicyName: avaliacao-somente-leitura
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListarConjunto
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt EvalBucket.Arn
              - Sid: LerConjunto
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${EvalBucket.Arn}/*"
              - Sid: ChaveGroqDev
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegrana/dev/groq/api_key"
              - Sid: DecifrarSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"

Outputs:
  GitHubDeployRoleArn:
    Description: Papel para o aws-actions/configure-aws-credentials (ambientes dev/prod).
    Value: !GetAtt GitHubDeployRole.Arn
  LambdaBoundaryArn:
    Value: !Ref LambdaBoundary
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  KillSwitchFunctionName:
    Value: !Ref KillSwitchFunction
  BudgetTripTopicArn:
    Value: !Ref BudgetTripTopic
  EvalBucketName:
    Value: !Ref EvalBucket
  GitHubEvalRoleArn:
    Description: Papel do job de avaliação da IA (ambiente avaliacao).
    Value: !GetAtt GitHubEvalRole.Arn
