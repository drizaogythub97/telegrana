# Avaliação da IA (PLANO 5.3; D036). Roda nos PRs que mudam algo que afeta a extração, e
# sob demanda (não repete no merge). Ritmo de 1 chamada a cada 20 s: usa ~metade do limite
# por minuto de cada modelo, que é dividido com o bot em produção (02/10/2026). O conjunto vem do bucket privado pelo OIDC (papel só de leitura); a chave é
# a do projeto de DEV do Groq (teto próprio). O log mostra só métricas e ids de caso.
name: Avaliação da IA

on:
  pull_request:
    paths:
      - "src/telegrana/ai/**"
      - "src/telegrana/core/extracao.py"
      - "src/telegrana/core/atalho.py"
      - "src/telegrana/core/entendimento.py"
      - "src/telegrana/core/audio.py"
      - "src/telegrana/core/interpretacao.py"
      - "src/telegrana/core/valores.py"
      - "src/telegrana/core/datas.py"
      - "src/telegrana/core/categorias.py"
      - "scripts/avaliar_ia.py"
      - ".github/workflows/avaliacao.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avaliacao-ia
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.20"
  PYTHON_VERSION: "3.14"

jobs:
  avaliacao:
    name: avaliacao
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: avaliacao
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: Credenciais AWS (somente leitura do conjunto)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.EVAL_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: telegrana-avaliacao-${{ github.run_id }}
      - name: Avaliar (só métricas no log)
        run: uv run python scripts/avaliar_ia.py --baixar "$BUCKET" --chave-ssm --modelo cadeia --intervalo 20 --prazo 2400
        env:
          BUCKET: ${{ vars.EVAL_BUCKET }}
      - name: Avaliar os áudios (Whisper + mesmo caminho; só métricas no log)
        if: ${{ !cancelled() }}
        run: uv run python scripts/avaliar_ia.py --baixar "$BUCKET" --chave-ssm --audio --modelo cadeia --modelo-audio cadeia --intervalo 20 --prazo 900
        env:
          BUCKET: ${{ vars.EVAL_BUCKET }}
