# CI/CD do Telegrana. PR: qualidade, testes, segredos. Push na main: + deploy em dev e
# E2E no servidor de testes do Telegram; com os dois verdes, deploy em prod (PLANO 10.3).
# Execução manual (workflow_dispatch) com prod=true: refaz o caminho até prod.
# Actions fixadas por hash de commit (a tag fica no comentário); o Dependabot atualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prod:
        description: "Também publicar em produção (depois do dev)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.20"
  PYTHON_VERSION: "3.14"

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check . --output-format github
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy (estrito)
        run: uv run mypy
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src scripts
      - name: pip-audit (vulnerabilidades conhecidas)
        run: uv run pip-audit --skip-editable --progress-spinner off

  testes:
    name: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Mesma versão major do Neon (D018).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: teste-local-ci
          POSTGRES_DB: telegrana_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credencial descartável do container efêmero do CI (não é segredo).
      TELEGRANA_TEST_DATABASE_URL: postgresql://postgres:teste-local-ci@localhost:5432/telegrana_teste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: Testes (unitários, integração, isolamento)
        run: uv run pytest

  segredos:
    name: segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (histórico completo)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # Deploy (D031): OIDC → papel telegrana-github-deploy (sem chaves fixas).
  # Ordem: pacote → migrações (compatíveis com a versão anterior) → stack → webhook.
  # -------------------------------------------------------------------
  deploy-dev:
    name: deploy-dev
    needs: [qualidade, testes, segredos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps: &passos-deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: telegrana-${{ github.job }}-${{ github.run_id }}
      - name: Pacote das Lambdas (linux arm64)
        run: uv run python scripts/build_lambda.py
      - name: Migrações do banco
        run: uv run python scripts/deploy_tasks.py migrar --env "$AMBIENTE"
        env:
          AMBIENTE: ${{ github.job == 'deploy-prod' && 'prod' || 'dev' }}
      - name: Publicar a stack
        env:
          AMBIENTE: ${{ github.job == 'deploy-prod' && 'prod' || 'dev' }}
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          BOUNDARY: ${{ vars.LAMBDA_BOUNDARY_ARN }}
        run: |
          aws cloudformation package --template-file deploy/app.yaml             --s3-bucket "$BUCKET" --s3-prefix "$AMBIENTE" --output-template-file .build/app.yaml
          aws cloudformation deploy --template-file .build/app.yaml --stack-name "telegrana-$AMBIENTE"             --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND             --parameter-overrides "Env=$AMBIENTE" "LambdaBoundaryArn=$BOUNDARY"             --no-fail-on-empty-changeset
      - name: Registrar o webhook no Telegram
        run: uv run python scripts/deploy_tasks.py webhook --env "$AMBIENTE"
        env:
          AMBIENTE: ${{ github.job == 'deploy-prod' && 'prod' || 'dev' }}
      - name: Menu de comandos e descrições do bot
        run: uv run python scripts/deploy_tasks.py perfil --env "$AMBIENTE"
        env:
          AMBIENTE: ${{ github.job == 'deploy-prod' && 'prod' || 'dev' }}
      - name: Verificar as Lambdas publicadas
        run: uv run python scripts/deploy_tasks.py verificar --env "$AMBIENTE"
        env:
          AMBIENTE: ${{ github.job == 'deploy-prod' && 'prod' || 'dev' }}

  e2e:
    name: e2e
    needs: [qualidade, testes, segredos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Segredos das contas de teste ficam no ambiente "e2e" (restrito à main).
    environment: e2e
    concurrency:
      group: e2e
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: teste-local-ci
          POSTGRES_DB: telegrana_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRANA_TEST_DATABASE_URL: postgresql://postgres:teste-local-ci@localhost:5432/telegrana_teste
      E2E_OBRIGATORIO: "1"  # sem configuração, falha (nunca pula)
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      E2E_BOT_TOKEN: ${{ secrets.E2E_BOT_TOKEN }}
      E2E_BOT_USERNAME: ${{ secrets.E2E_BOT_USERNAME }}
      E2E_SESSION_ADMIN: ${{ secrets.E2E_SESSION_ADMIN }}
      E2E_SESSION_A: ${{ secrets.E2E_SESSION_A }}
      E2E_SESSION_B: ${{ secrets.E2E_SESSION_B }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: E2E no servidor de testes do Telegram
        run: uv run pytest -m e2e

  deploy-prod:
    name: deploy-prod
    needs: [deploy-dev, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps: *passos-deploy
