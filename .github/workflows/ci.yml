# CI do Telegrana. Roda em todo PR e em push na main.
# Actions fixadas por hash de commit (a tag fica no comentário); o Dependabot atualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.20"
  PYTHON_VERSION: "3.14"

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check . --output-format github
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy (estrito)
        run: uv run mypy
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src scripts
      - name: pip-audit (vulnerabilidades conhecidas)
        run: uv run pip-audit --skip-editable --progress-spinner off

  testes:
    name: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Mesma versão major do Neon (D018).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: teste-local-ci
          POSTGRES_DB: telegrana_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credencial descartável do container efêmero do CI (não é segredo).
      TELEGRANA_TEST_DATABASE_URL: postgresql://postgres:teste-local-ci@localhost:5432/telegrana_teste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências (lock com hashes)
        run: uv sync --locked
      - name: Testes (unitários, integração, isolamento)
        run: uv run pytest

  segredos:
    name: segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (histórico completo)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
